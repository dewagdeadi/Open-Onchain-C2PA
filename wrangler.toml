# Cloudflare Pages project: static UI in /public, API in /functions.
name = "openprovenance"
pages_build_output_dir = "public"
compatibility_date = "2025-09-01"

[vars]
# Comma-separated Arweave gateways. Add a second, independent one in production.
GATEWAYS = "https://arweave.net"
# How uploads reach Arweave: "bundler" (free for small records) or "direct" (native Arweave transactions, paid in AR).
UPLOAD_MODE = "bundler"
BUNDLER_URL = "https://upload.ardrive.io"
ARWEAVE_NODE_URL = "https://arweave.net"
# Direct mode only: refuse any single upload costing more than this many winston (1 AR = 10^12 winston).
MAX_REWARD_WINSTON = "100000000000"
# Largest manifest store accepted by /api/publish (bytes). In bundler mode keep it under the free size; raise it for direct mode.
MAX_STORE_BYTES = "102400"
# Optional default trusted publisher addresses for /api/verify (comma-separated).
TRUSTED_UPLOADERS = ""

# Secrets (never in this file):
#   npx wrangler pages secret put ARWEAVE_JWK     # contents of wallet.json
#   npx wrangler pages secret put PUBLISH_TOKEN   # long random string
